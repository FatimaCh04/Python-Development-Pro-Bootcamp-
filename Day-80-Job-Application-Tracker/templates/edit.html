{% extends "base.html" %}

{% block title %}
Edit Application
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-4">
                    Edit Job Application
                </h2>


                <form method="POST">

                    <!-- Company -->

                    <div class="mb-3">

                        <label class="form-label">
                            Company Name
                        </label>

                        <input
                            type="text"
                            name="company"
                            value="{{ job.company }}"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Position -->

                    <div class="mb-3">

                        <label class="form-label">
                            Position
                        </label>

                        <input
                            type="text"
                            name="position"
                            value="{{ job.position }}"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            value="{{ job.location }}"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Status -->

                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value="Applied"
                                {% if job.status == "Applied" %}
                                selected
                                {% endif %}
                            >
                                Applied
                            </option>

                            <option
                                value="Interview"
                                {% if job.status == "Interview" %}
                                selected
                                {% endif %}
                            >
                                Interview
                            </option>

                            <option
                                value="Selected"
                                {% if job.status == "Selected" %}
                                selected
                                {% endif %}
                            >
                                Selected
                            </option>

                            <option
                                value="Rejected"
                                {% if job.status == "Rejected" %}
                                selected
                                {% endif %}
                            >
                                Rejected
                            </option>

                        </select>

                    </div>


                    <!-- Date -->

                    <div class="mb-3">

                        <label class="form-label">
                            Application Date
                        </label>

                        <input
                            type="date"
                            name="application_date"
                            value="{{ job.application_date }}"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Notes -->

                    <div class="mb-4">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                        >{{ job.notes or "" }}</textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Update Application
                    </button>

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
