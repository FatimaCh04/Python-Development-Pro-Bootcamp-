{% extends "base.html" %}

{% block title %}
Add Application
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-4">
                    Add Job Application
                </h2>


                <form method="POST">

                    <!-- Company -->

                    <div class="mb-3">

                        <label class="form-label">
                            Company Name
                        </label>

                        <input
                            type="text"
                            name="company"
                            class="form-control"
                            placeholder="e.g. Google"
                            required
                        >

                    </div>


                    <!-- Position -->

                    <div class="mb-3">

                        <label class="form-label">
                            Position
                        </label>

                        <input
                            type="text"
                            name="position"
                            class="form-control"
                            placeholder="e.g. Python Developer"
                            required
                        >

                    </div>


                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="e.g. Islamabad"
                            required
                        >

                    </div>


                    <!-- Status -->

                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Status
                            </option>

                            <option value="Applied">
                                Applied
                            </option>

                            <option value="Interview">
                                Interview
                            </option>

                            <option value="Selected">
                                Selected
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                        </select>

                    </div>


                    <!-- Date -->

                    <div class="mb-3">

                        <label class="form-label">
                            Application Date
                        </label>

                        <input
                            type="date"
                            name="application_date"
                            value="{{ today }}"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Notes -->

                    <div class="mb-4">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                            placeholder="Add notes about this application..."
                        ></textarea>

                    </div>


                    <!-- Buttons -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Application
                    </button>

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
