<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        My Blog
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🐍 My Blog
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        Built with Python & Flask 🐍
    </p>

    <p>
        100 Days of Python
    </p>

</footer>

</body>

</html>
