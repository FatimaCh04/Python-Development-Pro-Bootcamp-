<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Expense Tracker</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Animated Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="dashboard-container glass-panel">
        <header>
            <h1><i class="fa-solid fa-wallet"></i> Wallet<span class="highlight">Sync</span></h1>
            <p>Track your wealth beautifully.</p>
        </header>

        <main class="dashboard-grid">
            <!-- Left Side: Form and Stats -->
            <section class="left-panel">
                <div class="stats-container">
                    <div class="stat-card glass-panel total">
                        <h3>Total Balance</h3>
                        <h2 id="balance">$0.00</h2>
                    </div>
                    <div class="stat-row">
                        <div class="stat-card glass-panel income">
                            <i class="fa-solid fa-arrow-trend-up"></i>
                            <div>
                                <h3>Income</h3>
                                <p id="income-total">+$0.00</p>
                            </div>
                        </div>
                        <div class="stat-card glass-panel expense">
                            <i class="fa-solid fa-arrow-trend-down"></i>
                            <div>
                                <h3>Expense</h3>
                                <p id="expense-total">-$0.00</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="add-transaction glass-panel">
                    <h3>Add New Transaction</h3>
                    <form id="transaction-form">
                        <div class="form-control">
                            <label for="text">Description</label>
                            <input type="text" id="text" placeholder="e.g. Salary, Rent, Coffee" required>
                        </div>
                        <div class="form-control">
                            <label for="amount">Amount <small>(negative - expense, positive + income)</small></label>
                            <input type="number" id="amount" placeholder="-50 or 1000" step="0.01" required>
                        </div>
                        <div class="form-control">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="salary">Salary</option>
                                <option value="food">Food & Dining</option>
                                <option value="rent">Housing & Rent</option>
                                <option value="utilities">Utilities</option>
                                <option value="shopping">Shopping</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <button class="btn btn-glow">Add Transaction</button>
                    </form>
                </div>
            </section>

            <!-- Right Side: Chart and History -->
            <section class="right-panel">
                <div class="chart-container glass-panel">
                    <h3>Spending by Category</h3>
                    <div class="canvas-wrapper">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

                <div class="history-container glass-panel">
                    <h3>Recent Transactions</h3>
                    <ul id="list" class="list">
                        <!-- Transactions will be inserted here via JS -->
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
