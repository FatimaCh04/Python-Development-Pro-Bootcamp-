{% extends "base.html" %}


{% block title %}

{{ post.title }}

{% endblock %}


{% block content %}


<div class="container my-5">


    <article class="post-container">


        <span class="badge bg-dark">

            Post #{{ post.id }}

        </span>


        <h1 class="mt-3">

            {{ post.title }}

        </h1>


        <h4 class="text-muted">

            {{ post.subtitle }}

        </h4>


        <p class="text-muted mt-3">

            Written by
            <strong>
                {{ post.author }}
            </strong>

        </p>


        <hr>


        <p class="post-body">

            {{ post.body }}

        </p>


        <a
            href="{{ url_for('home') }}"
            class="btn btn-dark mt-4"
        >

            ← Back to Blog

        </a>


    </article>


</div>


{% endblock %}
