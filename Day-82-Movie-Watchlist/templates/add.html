{% extends "base.html" %}

{% block title %}
Add Movie
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-4">
                    🎬 Add Movie
                </h2>


                <form method="POST">

                    <!-- Title -->

                    <div class="mb-3">

                        <label class="form-label">
                            Movie Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="e.g. Inception"
                            required
                        >

                    </div>


                    <!-- Genre -->

                    <div class="mb-3">

                        <label class="form-label">
                            Genre
                        </label>

                        <input
                            type="text"
                            name="genre"
                            class="form-control"
                            placeholder="e.g. Sci-Fi"
                            required
                        >

                    </div>


                    <!-- Year -->

                    <div class="mb-3">

                        <label class="form-label">
                            Release Year
                        </label>

                        <input
                            type="number"
                            name="year"
                            class="form-control"
                            min="1888"
                            max="2100"
                            placeholder="e.g. 2010"
                            required
                        >

                    </div>


                    <!-- Rating -->

                    <div class="mb-3">

                        <label class="form-label">
                            Rating
                        </label>

                        <input
                            type="number"
                            name="rating"
                            class="form-control"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="e.g. 8.5"
                            required
                        >

                        <small class="text-muted">
                            Rating should be between 0 and 10.
                        </small>

                    </div>


                    <!-- Notes -->

                    <div class="mb-4">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                            placeholder="Add your thoughts or notes..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Movie
                    </button>


                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
