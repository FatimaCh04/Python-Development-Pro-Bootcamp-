{% extends "base.html" %}


{% block title %}

Add Movie

{% endblock %}


{% block content %}


<div class="container my-5">

    <div class="form-container">

        <h1>
            🎬 Add Movie
        </h1>

        <p class="text-muted">
            Add a movie to your Top 10 list.
        </p>


        <form
            method="POST"
            class="mt-4"
        >


            <div class="mb-3">

                <label class="form-label">
                    Movie Title
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Release Year
                </label>

                <input
                    type="number"
                    name="year"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    required
                ></textarea>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Rating
                </label>

                <input
                    type="number"
                    name="rating"
                    class="form-control"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Review
                </label>

                <textarea
                    name="review"
                    class="form-control"
                    rows="3"
                    required
                ></textarea>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Poster Image URL
                </label>

                <input
                    type="url"
                    name="img_url"
                    class="form-control"
                    placeholder="https://..."
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-dark"
            >
                Add Movie
            </button>


            <a
                href="{{ url_for('home') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


        </form>

    </div>

</div>


{% endblock %}
