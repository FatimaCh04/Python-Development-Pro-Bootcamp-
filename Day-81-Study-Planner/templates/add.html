{% extends "base.html" %}

{% block title %}
Add Study Task
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-4">
                    Add Study Task
                </h2>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="e.g. Complete Python Chapter 10"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Subject
                        </label>

                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            placeholder="e.g. Python"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Deadline
                        </label>

                        <input
                            type="date"
                            name="deadline"
                            value="{{ today }}"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Priority
                        </label>

                        <select
                            name="priority"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Priority
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>

                        </select>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                            placeholder="Add study notes..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Task
                    </button>

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
