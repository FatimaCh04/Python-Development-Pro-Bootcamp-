<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <h2 class="mb-4">Edit Expense</h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Expense Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ expense.title }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        name="amount"
                        step="0.01"
                        class="form-control"
                        value="{{ expense.amount }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select name="category" class="form-select">

                        <option
                            {% if expense.category == "Food" %}selected{% endif %}>
                            Food
                        </option>

                        <option
                            {% if expense.category == "Transport" %}selected{% endif %}>
                            Transport
                        </option>

                        <option
                            {% if expense.category == "Shopping" %}selected{% endif %}>
                            Shopping
                        </option>

                        <option
                            {% if expense.category == "Education" %}selected{% endif %}>
                            Education
                        </option>

                        <option
                            {% if expense.category == "Bills" %}selected{% endif %}>
                            Bills
                        </option>

                        <option
                            {% if expense.category == "Entertainment" %}selected{% endif %}>
                            Entertainment
                        </option>

                        <option
                            {% if expense.category == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        class="form-control"
                        value="{{ expense.date }}"
                        required
                    >

                </div>

                <button class="btn btn-success">
                    Update Expense
                </button>

                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
