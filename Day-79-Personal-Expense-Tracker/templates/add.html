<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <h2 class="mb-4">Add Expense</h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Expense Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="e.g. Grocery"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        name="amount"
                        step="0.01"
                        class="form-control"
                        placeholder="0.00"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select name="category" class="form-select" required>

                        <option value="">Select category</option>
                        <option>Food</option>
                        <option>Transport</option>
                        <option>Shopping</option>
                        <option>Education</option>
                        <option>Bills</option>
                        <option>Entertainment</option>
                        <option>Other</option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        class="form-control"
                        required
                    >

                </div>

                <button class="btn btn-primary">
                    Save Expense
                </button>

                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
