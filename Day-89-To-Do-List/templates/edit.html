{% extends "base.html" %}


{% block title %}
TaskFlow | Edit Task
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="form-wrapper">

        <div class="form-header">

            <div class="form-icon">
                ✎
            </div>

            <h1>
                Edit Task
            </h1>

            <p>
                Update the details of your task.
            </p>

        </div>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for(
                'edit_task',
                task_id=todo.id
            ) }}"
        >

            <div class="mb-4">

                <label
                    for="title"
                    class="form-label"
                >
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    class="form-control form-control-lg"
                    value="{{ todo.title }}"
                    required
                >

            </div>


            <div class="mb-4">

                <label
                    for="description"
                    class="form-label"
                >
                    Description
                    <span class="optional">
                        Optional
                    </span>
                </label>

                <textarea
                    id="description"
                    name="description"
                    class="form-control"
                    rows="5"
                >{{ todo.description or "" }}</textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
