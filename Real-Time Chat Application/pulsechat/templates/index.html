<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PulseChat - Real-Time Communication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <!-- Join Screen -->
        <div id="join-screen" class="screen active">
            <div class="join-card">
                <div class="join-header">
                    <div class="logo">
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </div>
                    <h1>PulseChat</h1>
                    <p>Professional real-time communication.</p>
                </div>
                
                <form id="join-form" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your name" autocomplete="off" maxlength="30">
                        <span class="error-msg" id="username-error">Username is required</span>
                    </div>
                    
                    <div class="form-group">
                        <label for="room">Room Code</label>
                        <input type="text" id="room" placeholder="Enter room code" autocomplete="off" maxlength="30">
                        <span class="error-msg" id="room-error">Room code is required</span>
                    </div>
                    
                    <button type="submit" id="join-btn" class="btn btn-primary btn-block">
                        <span class="btn-text">Join Workspace</span>
                        <span class="spinner" style="display: none;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin-icon">
                                <line x1="12" y1="2" x2="12" y2="6"></line>
                                <line x1="12" y1="18" x2="12" y2="22"></line>
                                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                                <line x1="2" y1="12" x2="6" y2="12"></line>
                                <line x1="18" y1="12" x2="22" y2="12"></line>
                                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Chat Interface -->
        <div id="chat-screen" class="screen">
            <div class="chat-layout">
                
                <!-- Sidebar -->
                <aside class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <div class="logo-small">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                            </svg>
                            <h2>PulseChat</h2>
                        </div>
                        <button class="mobile-close-btn" id="mobile-close-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <div class="sidebar-content">
                        <div class="room-info-card">
                            <div class="room-label">CURRENT ROOM</div>
                            <h3 id="sidebar-room-name">#general</h3>
                        </div>

                        <div class="users-section">
                            <div class="section-header">
                                <div class="section-label">ONLINE USERS</div>
                                <span class="badge" id="online-count">0</span>
                            </div>
                            <ul class="users-list" id="users-list">
                                <!-- Users dynamically injected -->
                            </ul>
                        </div>
                    </div>

                    <div class="sidebar-footer">
                        <div class="current-user">
                            <div class="user-avatar" id="current-user-avatar"></div>
                            <span id="current-username">User</span>
                        </div>
                        <button id="leave-btn" class="btn btn-secondary btn-full">Leave Room</button>
                    </div>
                </aside>

                <!-- Mobile Overlay -->
                <div class="sidebar-overlay" id="sidebar-overlay"></div>

                <!-- Main Chat Area -->
                <main class="chat-main">
                    <header class="chat-header">
                        <div class="header-left">
                            <button class="mobile-menu-btn" id="mobile-menu-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="3" y1="12" x2="21" y2="12"></line>
                                    <line x1="3" y1="6" x2="21" y2="6"></line>
                                    <line x1="3" y1="18" x2="21" y2="18"></line>
                                </svg>
                            </button>
                            <div class="header-title">
                                <h2 id="main-room-name">#general</h2>
                                <div class="connection-status" id="connection-status">
                                    <span class="status-dot"></span>
                                    <span class="status-text">Connecting...</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div class="messages-container" id="messages-container">
                        <div class="empty-state" id="empty-state" style="display: none;">
                            <div class="empty-icon">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                            <h3>No messages yet</h3>
                            <p>Be the first to start the conversation!</p>
                        </div>
                        <!-- Messages dynamically injected -->
                    </div>

                    <div class="typing-indicator" id="typing-indicator"></div>

                    <div class="composer-container">
                        <form id="chat-form" class="composer-form">
                            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" maxlength="1000">
                            <button type="submit" class="btn-send" id="send-btn" disabled>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </form>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
