{% extends "base.html" %}

{% block title %}
Register | My Blog
{% endblock %}


{% block content %}


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            ✨
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join the blog community and start writing.
        </p>


        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Your name"
                required
            >


            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Create a password"
                required
                minlength="6"
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Repeat your password"
                required
                minlength="6"
            >


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>


{% endblock %}
