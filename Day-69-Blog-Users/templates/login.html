{% extends "base.html" %}

{% block title %}
Login | My Blog
{% endblock %}


{% block content %}


<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue to your blog.
        </p>


        <form method="POST">

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </p>

    </div>

</div>


{% endblock %}
