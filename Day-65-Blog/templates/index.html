<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blog</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- IMPORTANT: YOUR CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('home') }}"
        >
            ✍️ My Blog
        </a>


        <div>

            <a
                href="{{ url_for('home') }}"
                class="btn btn-outline-light btn-sm"
            >
                Home
            </a>


            <a
                href="{{ url_for('about') }}"
                class="btn btn-light btn-sm"
            >
                About
            </a>

        </div>

    </div>

</nav>



<!-- ================= HERO ================= -->

<section class="hero">

    <div class="container text-center">

        <h1>
            Welcome to My Blog
        </h1>

        <p>
            Thoughts, ideas and my coding journey.
        </p>

    </div>

</section>



<!-- ================= BLOG POSTS ================= -->

<div class="container blog-container">

    <div class="row g-4">


        {% for post in posts %}


        <div class="col-12 col-md-6">


            <div class="blog-card">


                <!-- IMAGE + TEXT OVERLAY -->

                <div class="blog-image-wrapper">

                    <img
                        src="{{ post.image }}"
                        alt="{{ post.title }}"
                        class="blog-image"
                    >


                    <!-- TEXT ON IMAGE -->

                    <div class="image-overlay">

                        <h2>
                            {{ post.title }}
                        </h2>

                        <p>
                            {{ post.subtitle }}
                        </p>

                    </div>

                </div>



                <!-- CARD CONTENT -->

                <div class="card-body">

                    <small class="text-muted">

                        {{ post.date }}
                        •
                        {{ post.author }}

                    </small>


                    <p class="mt-3">

                        {{ post.body[:120] }}...

                    </p>


                    <a
                        href="{{ url_for(
                            'post',
                            post_id=post.id
                        ) }}"
                        class="btn btn-dark"
                    >

                        Read More →

                    </a>

                </div>


            </div>


        </div>


        {% endfor %}


    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 My Blog • Day 65 🐍
    </p>

</footer>


</body>

</html>
