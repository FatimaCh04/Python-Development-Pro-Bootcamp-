<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ post.title }}
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('home') }}"
        >
            ✍️ My Blog
        </a>


        <a
            href="{{ url_for('home') }}"
            class="btn btn-outline-light btn-sm"
        >
            ← Home
        </a>

    </div>

</nav>



<!-- POST -->

<div class="container">

    <div class="post-container">


        <!-- POST IMAGE -->

        <div class="post-image-wrapper">

            <img
                src="{{ post.image }}"
                alt="{{ post.title }}"
                class="post-image"
            >

        </div>


        <h1 class="mt-4">

            {{ post.title }}

        </h1>


        <p class="text-muted">

            {{ post.date }}
            •
            {{ post.author }}

        </p>


        <h4 class="mt-4">

            {{ post.subtitle }}

        </h4>


        <p class="post-body">

            {{ post.body }}

        </p>


        <a
            href="{{ url_for('home') }}"
            class="btn btn-dark"
        >
            ← Back to Blog
        </a>


    </div>

</div>


</body>

</html>
