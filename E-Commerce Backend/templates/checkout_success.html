<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Field & Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body { display:flex; align-items:center; justify-content:center;
           min-height:100vh; background:var(--parchment,#EDE6D6); }
    .card {
      background:#fff; border-radius:12px; padding:56px 48px;
      max-width:520px; width:90%; text-align:center;
      box-shadow:0 4px 32px rgba(28,27,23,.08);
    }
    .icon { font-size:52px; margin-bottom:24px; }
    h1 { font-family:'Fraunces',serif; font-size:clamp(26px,4vw,36px);
         color:#2C3A2E; margin:0 0 12px; }
    p  { color:#666; line-height:1.7; margin:0 0 32px; }
    .ref { font-family:'JetBrains Mono',monospace; font-size:12px;
           color:#999; margin-bottom:32px; word-break:break-all; }
    .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1>Order confirmed</h1>
    <p>Thank you! Your order has been placed and a confirmation email is on its way.</p>
    {% if session_id %}
    <p class="ref">Stripe session: {{ session_id }}</p>
    {% endif %}
    <div class="actions">
      <a href="/" class="btn btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:14px 28px;">
        Continue shopping
      </a>
      <a href="/api/checkout/orders" class="btn btn-outline"
         style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:14px 28px;">
        View orders (JSON)
      </a>
    </div>
  </div>
</body>
</html>
