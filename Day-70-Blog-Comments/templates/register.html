{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p>
            Start sharing your stories.
        </p>


        <form method="POST">

            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                minlength="6"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="btn btn-primary w-100 mt-4"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
