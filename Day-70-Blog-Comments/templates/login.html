{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your account.
        </p>


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required
            >


            <button
                type="submit"
                class="btn btn-primary w-100 mt-4"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
