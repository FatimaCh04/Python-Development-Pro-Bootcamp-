{% extends "base.html" %}


{% block title %}

{% if post %}
Edit Post
{% else %}
Create Post
{% endif %}

{% endblock %}


{% block content %}


<div class="container my-5">


    <div class="form-container">


        <h1>

            {% if post %}
                ✏️ Edit Post
            {% else %}
                ✍️ Create New Post
            {% endif %}

        </h1>


        <form
            method="POST"
            class="mt-4"
        >


            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{% if post %}{{ post.title }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Subtitle
                </label>

                <input
                    type="text"
                    name="subtitle"
                    class="form-control"
                    value="{% if post %}{{ post.subtitle }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Author
                </label>

                <input
                    type="text"
                    name="author"
                    class="form-control"
                    value="{% if post %}{{ post.author }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Date
                </label>

                <input
                    type="text"
                    name="date"
                    class="form-control"
                    placeholder="August 14, 2026"
                    value="{% if post %}{{ post.date }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Image URL
                </label>

                <input
                    type="url"
                    name="image_url"
                    class="form-control"
                    value="{% if post %}{{ post.image_url }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Post Content
                </label>

                <textarea
                    name="body"
                    class="form-control"
                    rows="8"
                    required
                >{% if post %}{{ post.body }}{% endif %}</textarea>

            </div>


            <button
                type="submit"
                class="btn btn-dark"
            >

                {% if post %}
                    Save Changes
                {% else %}
                    Publish Post
                {% endif %}

            </button>


            <a
                href="{{ url_for('home') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


        </form>


    </div>

</div>


{% endblock %}
