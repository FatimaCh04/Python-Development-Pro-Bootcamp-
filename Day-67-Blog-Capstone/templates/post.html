{% extends "base.html" %}


{% block title %}

{{ post.title }}

{% endblock %}


{% block content %}


<div class="container post-container">


    <img
        src="{{ post.image_url }}"
        class="post-image"
        alt="{{ post.title }}"
    >


    <div class="post-content">


        <small class="text-muted">

            {{ post.date }} • {{ post.author }}

        </small>


        <h1>

            {{ post.title }}

        </h1>


        <h4>

            {{ post.subtitle }}

        </h4>


        <hr>


        <p class="post-body">

            {{ post.body }}

        </p>


        <div class="mt-4">


            <a
                href="{{ url_for(
                    'edit_post',
                    post_id=post.id
                ) }}"
                class="btn btn-warning"
            >
                ✏️ Edit
            </a>


            <form
                action="{{ url_for(
                    'delete_post',
                    post_id=post.id
                ) }}"
                method="POST"
                class="d-inline"
                onsubmit="return confirm(
                    'Are you sure you want to delete this post?'
                );"
            >

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    🗑 Delete
                </button>

            </form>


            <a
                href="{{ url_for('home') }}"
                class="btn btn-secondary"
            >
                ← Back
            </a>


        </div>


    </div>


</div>


{% endblock %}
