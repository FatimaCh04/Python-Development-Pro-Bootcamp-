{% extends "base.html" %}

{% block title %}
Edit Post
{% endblock %}


{% block content %}

<div class="container my-5">

    <div class="form-container">

        <h1>
            Edit Post ✏️
        </h1>


        <form
            method="POST"
            class="mt-4"
        >

            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ post.title }}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Subtitle
                </label>

                <input
                    type="text"
                    name="subtitle"
                    class="form-control"
                    value="{{ post.subtitle }}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Author
                </label>

                <input
                    type="text"
                    name="author"
                    class="form-control"
                    value="{{ post.author }}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Body
                </label>

                <textarea
                    name="body"
                    class="form-control"
                    rows="8"
                    required
                >{{ post.body }}</textarea>

            </div>


            <button
                type="submit"
                class="btn btn-success"
            >
                Save Changes
            </button>


            <a
                href="{{ url_for(
                    'show_post',
                    post_id=post.id
                ) }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
