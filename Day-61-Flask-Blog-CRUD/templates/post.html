{% extends "base.html" %}

{% block title %}
{{ post.title }}
{% endblock %}


{% block content %}

<div class="container my-5">

    <article class="post-container">

        <span class="badge bg-dark">
            Post #{{ post.id }}
        </span>

        <h1 class="mt-3">
            {{ post.title }}
        </h1>

        <h4 class="text-muted">
            {{ post.subtitle }}
        </h4>

        <p class="text-muted mt-3">
            Written by
            <strong>
                {{ post.author }}
            </strong>
        </p>

        <hr>

        <p class="post-body">
            {{ post.body }}
        </p>


        <div class="d-flex gap-2 mt-4">

            <a
                href="{{ url_for(
                    'edit_post',
                    post_id=post.id
                ) }}"
                class="btn btn-warning"
            >
                ✏️ Edit
            </a>


            <form
                action="{{ url_for(
                    'delete_post',
                    post_id=post.id
                ) }}"
                method="POST"
                onsubmit="return confirm(
                    'Are you sure you want to delete this post?'
                );"
            >

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    🗑 Delete
                </button>

            </form>


            <a
                href="{{ url_for('home') }}"
                class="btn btn-secondary"
            >
                ← Back
            </a>

        </div>

    </article>

</div>

{% endblock %}
