{% extends "base.html" %}

{% block title %}
Create Post
{% endblock %}


{% block content %}

<div class="container my-5">

    <div class="form-container">

        <h1>
            Create New Post ✍️
        </h1>

        <p class="text-muted">
            Add a new article to your blog.
        </p>


        <form
            method="POST"
            class="mt-4"
        >

            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Enter post title"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Subtitle
                </label>

                <input
                    type="text"
                    name="subtitle"
                    class="form-control"
                    placeholder="Enter subtitle"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Author
                </label>

                <input
                    type="text"
                    name="author"
                    class="form-control"
                    placeholder="Enter author name"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Body
                </label>

                <textarea
                    name="body"
                    class="form-control"
                    rows="8"
                    placeholder="Write your blog post..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn btn-dark"
            >
                Publish Post
            </button>


            <a
                href="{{ url_for('home') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
