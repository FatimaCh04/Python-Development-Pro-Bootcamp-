{% extends "base.html" %}

{% block title %}
Add Transaction
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-4">
                    💰 Add Transaction
                </h2>


                <form method="POST">

                    <!-- Title -->

                    <div class="mb-3">

                        <label class="form-label">
                            Transaction Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="e.g. Monthly Salary"
                            required
                        >

                    </div>


                    <!-- Amount -->

                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            min="0.01"
                            step="0.01"
                            placeholder="e.g. 50000"
                            required
                        >

                    </div>


                    <!-- Type -->

                    <div class="mb-3">

                        <label class="form-label">
                            Transaction Type
                        </label>

                        <select
                            name="transaction_type"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Type
                            </option>

                            <option value="Income">
                                Income
                            </option>

                            <option value="Expense">
                                Expense
                            </option>

                        </select>

                    </div>


                    <!-- Category -->

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            name="category"
                            class="form-control"
                            placeholder="e.g. Food, Salary, Transport"
                            required
                        >

                    </div>


                    <!-- Date -->

                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- Notes -->

                    <div class="mb-4">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                            placeholder="Add additional details..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Transaction
                    </button>


                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
