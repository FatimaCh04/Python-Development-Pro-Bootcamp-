<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Coffee & WiFi
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}"
    >

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('home') }}"
        >
            ☕ Coffee & WiFi
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('home') }}"
                    >
                        Home
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('cafes') }}"
                    >
                        Cafes
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('add_cafe') }}"
                    >
                        Add Cafe
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


{% block content %}

{% endblock %}


<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">

        Day 62 • 100 Days of Python 🐍

    </p>

</footer>


</body>

</html>
