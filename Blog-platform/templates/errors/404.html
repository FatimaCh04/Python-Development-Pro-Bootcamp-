{% extends 'base.html' %}

{% block title %}Page Not Found - DevBlog{% endblock %}

{% block content %}

<div class="text-center py-5 my-5">
    <div class="mb-4 text-primary">
        <i class="bi bi-file-earmark-x display-1 fw-bold"></i>
    </div>
    <h1 class="display-4 fw-bold">404 - Page Not Found</h1>
    <p class="lead text-muted max-w-md mx-auto mb-4">
        Oops! The page or blog post you are looking for doesn't exist, has been removed, or moved to a new URL.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
        <i class="bi bi-house-door me-2"></i> Return to Home Feed
    </a>
</div>

{% endblock %}
