{% extends 'base.html' %}

{% block title %}Access Denied - DevBlog Platform{% endblock %}

{% block content %}

<div class="text-center py-5 my-5">
    <div class="mb-4 text-warning">
        <i class="bi bi-shield-slash display-1 fw-bold"></i>
    </div>
    <h1 class="display-4 fw-bold">403 - Forbidden Access</h1>
    <p class="lead text-muted max-w-md mx-auto mb-4">
        You do not have permission to access or modify this resource. Only the post author can perform this action.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
        <i class="bi bi-house-door me-2"></i> Return to Home Feed
    </a>
</div>

{% endblock %}
