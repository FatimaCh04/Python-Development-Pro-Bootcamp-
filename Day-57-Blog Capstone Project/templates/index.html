<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Python Blog</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            🐍 Python Blog
        </a>

        <div>

            <a
                class="nav-link d-inline-block text-white"
                href="/"
            >
                Home
            </a>

            <a
                class="nav-link d-inline-block text-white"
                href="/about"
            >
                About
            </a>

            <a
                class="nav-link d-inline-block text-white"
                href="/contact"
            >
                Contact
            </a>

        </div>

    </div>

</nav>


<header class="hero">

    <div class="container text-center">

        <h1>
            Welcome to My Python Blog
        </h1>

        <p>
            Sharing my journey through
            100 Days of Python.
        </p>

    </div>

</header>


<main class="container my-5">

    <div class="row g-4">

        {% for post in posts %}

        <div class="col-md-4">

            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <span class="badge bg-secondary mb-3">
                        Day {{ post.id }}
                    </span>

                    <h3 class="card-title">
                        {{ post.title }}
                    </h3>

                    <p class="text-muted">
                        {{ post.subtitle }}
                    </p>

                    <p class="card-text">
                        {{ post.body[:120] }}...
                    </p>

                    <a
                        href="{{ url_for(
                            'show_post',
                            post_id=post.id
                        ) }}"
                        class="btn btn-dark"
                    >
                        Read More →
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</main>


<footer class="bg-dark text-white text-center p-4">

    <p class="mb-0">
        Day 57 • 100 Days of Python 🐍
    </p>

</footer>


</body>

</html>
