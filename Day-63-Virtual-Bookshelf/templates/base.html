<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Virtual Bookshelf
        {% endblock %}
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}"
    >

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('home') }}"
        >
            📚 My Bookshelf
        </a>


        <div>

            <a
                href="{{ url_for('home') }}"
                class="btn btn-outline-light me-2"
            >
                Books
            </a>


            <a
                href="{{ url_for('add_book') }}"
                class="btn btn-light"
            >
                + Add Book
            </a>

        </div>

    </div>

</nav>


{% block content %}

{% endblock %}


<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">

        Day 63 • 100 Days of Python 🐍

    </p>

</footer>


</body>

</html>
