{% extends "base.html" %}


{% block title %}

{% if book %}
Edit Book
{% else %}
Add Book
{% endif %}

{% endblock %}


{% block content %}


<div class="container my-5">


    <div class="form-container">


        {% if book %}

        <h1>
            ✏️ Edit Book
        </h1>

        <p class="text-muted">
            Update your book information.
        </p>


        {% else %}

        <h1>
            ➕ Add New Book
        </h1>

        <p class="text-muted">
            Add a new book to your bookshelf.
        </p>

        {% endif %}


        <form
            method="POST"
            class="mt-4"
        >


            <div class="mb-3">

                <label class="form-label">

                    Book Title

                </label>


                <input
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Enter book title"
                    value="{% if book %}{{ book.title }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">

                    Author

                </label>


                <input
                    type="text"
                    name="author"
                    class="form-control"
                    placeholder="Enter author name"
                    value="{% if book %}{{ book.author }}{% endif %}"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">

                    Rating

                </label>


                <input
                    type="number"
                    name="rating"
                    class="form-control"
                    placeholder="Enter rating from 0 to 10"
                    min="0"
                    max="10"
                    step="0.1"
                    value="{% if book %}{{ book.rating }}{% endif %}"
                    required
                >

            </div>


            <div class="mt-4">


                <button
                    type="submit"
                    class="btn btn-dark"
                >

                    {% if book %}
                    Save Changes
                    {% else %}
                    Add Book
                    {% endif %}

                </button>


                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-secondary"
                >

                    Cancel

                </a>


            </div>


        </form>


    </div>


</div>


{% endblock %}
