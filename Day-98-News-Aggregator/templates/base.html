<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}NewsFlow{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="{{ url_for('index') }}" class="logo">
            📰 NewsFlow
        </a>

        <div class="nav-label">
            Day 98 • Python
        </div>

    </div>

</header>


<main>
    {% block content %}
    {% endblock %}
</main>


<footer>
    <div class="container">
        <p>
            Built with Python & Flask • 100 Days of Python
        </p>
    </div>
</footer>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
