name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      # Provide a dummy SECRET_KEY so Flask config.py does not raise ValueError
      # during test collection. No real secret is exposed here.
      SECRET_KEY: ci-test-secret-key-not-for-production
      APP_NAME: DockFlow
      APP_VERSION: 1.0.0
      FLASK_ENV: testing
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run pytest
        run: pytest
        
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing

  docker_build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker image (CI verify — runs on push and pull_request)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # push=false on pull_request (no credentials needed); push=true on push to main
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dockflow:latest
            ${{ secrets.DOCKER_USERNAME }}/dockflow:${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker_build
    if: github.event_name == 'push'
    
    steps:
      - name: CD Artifact Status
        run: |
          echo "The Docker image has been successfully pushed to Docker Hub."
          echo "Docker Hub is our configured CD destination, and the published image is the deployment artifact."
          
      - name: Optional VPS Deployment Prep
        if: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_USERNAME != '' && secrets.SERVER_SSH_KEY != '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "VPS deployment credentials found!"
          echo "If a deployment script were configured, it would SSH to $SERVER_HOST here."
          # SSH logic would go here using SERVER_USERNAME and SERVER_SSH_KEY
